name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda and Python 3.10
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          auto-activate-base: true
          python-version: "3.10"

      - name: Install dependencies
        run: conda env update --file environment.yml --name base
        shell: bash -el {0}

      - name: Install linting and testing tools
        run: conda install --yes flake8 pytest
        shell: bash -el {0}

      - name: Lint with flake8
        run: |
          # Fail on serious syntax and undefined-name errors.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Report other style issues, but don't fail the build for them.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        shell: bash -el {0}

      - name: Test with pytest
        run: pytest
        shell: bash -el {0}
